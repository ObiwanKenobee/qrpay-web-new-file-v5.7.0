name: Sanctum Scan PHP lint and feature tests

on:
  push:
    branches:
      - 'sanctum-scan/**'
    paths:
      - '**/*.php'
      - '.github/workflows/sanctum-scan-php-lint.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.php'
      - '.github/workflows/sanctum-scan-php-lint.yml'

permissions:
  contents: read

jobs:
  php-lint:
    name: Lint PHP and run Sanctum Scan feature tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Lint changed PHP files
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --depth=1
            DIFF_RANGE="origin/$BASE_REF...HEAD"
          elif [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "Initial branch push detected; comparing with the default branch."
            git fetch origin "main:refs/remotes/origin/main" --depth=1
            DIFF_RANGE="origin/main...HEAD"
          else
            DIFF_RANGE="$BASE_SHA...HEAD"
          fi

          php_files_path="$RUNNER_TEMP/sanctum-scan-php-files"
          if ! git diff --diff-filter=ACMRT --name-only -z "$DIFF_RANGE" -- '*.php' > "$php_files_path"; then
            echo "Unable to determine changed PHP files for diff range: $DIFF_RANGE"
            exit 1
          fi

          mapfile -d '' -t php_files < "$php_files_path"

          if [[ ${#php_files[@]} -eq 0 ]]; then
            echo "No changed PHP files to lint."
            exit 0
          fi

          for file in "${php_files[@]}"; do
            echo "Linting $file"
            php -l "$file"
          done

      - name: Install Composer dependencies
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Prepare application key
        run: php artisan key:generate --force

      - name: Run offline provenance verifier unit tests
        env:
          APP_ENV: testing
        run: vendor/bin/phpunit tests/Unit/SanctumScan/ProvenanceManifestVerifierTest.php

      - name: Run offline provenance verifier command tests
        env:
          APP_ENV: testing
        run: vendor/bin/phpunit tests/Feature/SanctumScan/ProvenanceManifestVerifierCommandTest.php

      - name: Run Sanctum Scan feature tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: vendor/bin/phpunit tests/Feature/SanctumScan/EconomicExchangeLifecycleTest.php
