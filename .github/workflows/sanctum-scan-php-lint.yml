name: Sanctum Scan PHP lint and feature tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.php'
      - '.github/workflows/sanctum-scan-php-lint.yml'

permissions:
  contents: read

jobs:
  php-lint:
    name: Lint PHP and run Sanctum Scan feature tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Lint changed PHP files
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          git fetch origin "$BASE_REF" --depth=1
          mapfile -t php_files < <(git diff --diff-filter=ACMRT --name-only "origin/$BASE_REF...HEAD" -- '*.php')

          if [[ ${#php_files[@]} -eq 0 ]]; then
            echo "No changed PHP files to lint."
            exit 0
          fi

          for file in "${php_files[@]}"; do
            echo "Linting $file"
            php -l "$file"
          done

      - name: Install Composer dependencies
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Prepare application key
        run: php artisan key:generate --force

      - name: Run Sanctum Scan feature tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: vendor/bin/phpunit tests/Feature/SanctumScan/EconomicExchangeLifecycleTest.php
